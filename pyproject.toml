[project]
name = "claudetop"
version = "0.1.0"
description = "Inspect and clean up Claude Code sessions on disk"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "H S Helson Go" }]
keywords = ["claude", "claude-code", "tui", "textual", "cli"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Utilities",
]
requires-python = ">=3.12"
dependencies = [
    "textual>=8.2.8",
]

[project.urls]
Homepage = "https://github.com/Hs293Go/claudetop"
Issues = "https://github.com/Hs293Go/claudetop/issues"

[project.scripts]
claudetop = "claudetop.cli:main"

[build-system]
requires = ["uv_build>=0.9.8,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# try/except/pass is deliberate in per-file loops, where suppress() adds overhead.
ignore = ["SIM105"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "ty>=0.0.80",
]
